<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Концепт минималистичного главного экрана</title>
  <desc id="desc">Три плитки: Lampa, TorrServe, Vimu. Ниже папка остальных приложений. Графитовый фон, бежевый текст и терракотовый акцент.</desc>
  <rect width="1200" height="700" rx="24" fill="#262727"/>
